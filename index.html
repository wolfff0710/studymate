<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StudyMate – Class 12 Planner</title><meta name="theme-color" content="#3b82f6"><link rel="manifest" href="manifest.json"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎓%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f3f6fb;--cd:rgba(255,255,255,.72);--tx:#1c2433;--mu:#6b7690;--bd:rgba(255,255,255,.75);--ac:#3b82f6;--ac2:#06b6d4;--rd:#ef4444;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-mode="light"]){--bg:#0e1424;--cd:rgba(34,46,72,.62);--tx:#e8ecf5;--mu:#93a0bd;--bd:rgba(255,255,255,.09);color-scheme:dark}}
:root[data-mode="dark"]{--bg:#0e1424;--cd:rgba(34,46,72,.62);--tx:#e8ecf5;--mu:#93a0bd;--bd:rgba(255,255,255,.09);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(circle at 8% 0,color-mix(in srgb,var(--ac) 24%,transparent),transparent 45%),radial-gradient(circle at 95% 100%,color-mix(in srgb,var(--ac2) 24%,transparent),transparent 45%),var(--bg);background-attachment:fixed}
#main{max-width:760px;margin:auto;padding:14px 14px 170px}h2{margin:6px 0}h2 small{display:block;font-weight:400;font-size:13px}h3{margin:18px 0 6px;font-size:15px}small{color:var(--mu)}.r{display:flex;gap:8px;align-items:center}.g{flex:1}
.cd{background:var(--cd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px;box-shadow:0 6px 22px rgba(0,0,0,.08);transition:.2s}.cd:hover{transform:translateY(-2px)}
.tk{padding:12px;margin:8px 0;border-left:6px solid var(--tc)}.tk.dn{opacity:.55}.tk.dn b{text-decoration:line-through}.tk.od{background:color-mix(in srgb,var(--rd) 15%,var(--cd));border-color:var(--rd)}.tk.od small{color:var(--rd)}.tk b,.tk small{display:block}.nt{margin:8px 0 0 44px;font-size:13px;color:var(--mu)}
.ck{width:36px;height:36px;border-radius:50%;border:2px solid var(--tc);background:none;color:#fff;font-size:18px;cursor:pointer;flex:none;transition:.2s}.ck:hover{transform:scale(1.15)}.dn .ck{background:var(--tc)}
.ic{min-width:44px;height:44px;border:0;background:none;color:var(--tx);font-size:20px;cursor:pointer;border-radius:12px;transition:.2s}.ic:hover{background:var(--bd)}
.sz{margin:8px 0 0 44px;flex-wrap:wrap}.sz button{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer;transition:.2s}.sz button:hover{background:var(--ac);color:#fff}
.bg{display:inline-block;padding:1px 8px;border-radius:9px;color:#fff;font-size:11px;margin-right:4px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px)}.pr{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}.btn.rd,.rd{color:var(--rd)}
.pg{height:10px;overflow:hidden;border-radius:6px;margin:8px 0 2px}.pg div{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:.4s}
.dy{padding:10px;margin:8px 0}.dy.now,.mc.now{outline:2px solid var(--ac)}.dy.hv,.mc.hv{outline:2px dashed var(--ac2)}
.chip{display:inline-block;margin:4px 4px 0 0;padding:6px 10px;border-radius:12px;border:2px solid var(--ty);border-left:6px solid var(--tc);background:var(--cd);font-size:13px;cursor:grab}.chip.dn{opacity:.5;text-decoration:line-through}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.mc{min-height:64px;padding:4px;border-radius:12px;cursor:pointer}.mc.ot{opacity:.4}.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin:1px;cursor:grab}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--cd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);z-index:5}
nav button{flex:1;min-height:52px;border:0;background:none;color:var(--mu);font-size:11px;cursor:pointer;border-radius:14px;transition:.2s}nav button span{display:block;font-size:20px}nav button:hover{transform:translateY(-2px)}nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;font-size:30px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer;z-index:6;transition:.25s}#fab:hover{transform:scale(1.1) rotate(90deg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}.ov.on{display:flex}.sh{width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;background:var(--bg);padding:18px;animation:up .25s}@keyframes up{from{transform:translateY(40px);opacity:0}}
label{display:block;margin:8px 0;font-size:13px;color:var(--mu)}input,select,textarea{width:100%;min-height:44px;padding:8px 10px;margin-top:4px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit}
#pop{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;max-width:440px;margin:auto;z-index:20;display:grid;gap:8px}.tt{padding:12px 44px 12px 14px;position:relative;background:var(--bg);animation:in .3s}.tt .ic{position:absolute;right:0;top:0}@keyframes in{from{opacity:0;transform:translateY(-14px)}}
.p{padding:14px;margin:10px 0}.p .btn{margin:6px 6px 0 0}.sw{width:48px;height:48px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.2s}.sw:hover{transform:scale(1.12)}.sw.on{border-color:var(--tx)}.em{text-align:center;padding:40px 10px;color:var(--mu)}.em div{font-size:54px}
math{font-size:1.1em}
.tb{overflow-x:auto;gap:6px;padding:4px 0;margin:4px 0}.pl{flex:none;white-space:nowrap;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;cursor:pointer;transition:.2s}.pl:hover{transform:translateY(-2px)}.pl.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.cfb{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:var(--cd);font-size:20px;cursor:pointer;transition:.2s}.cfb:hover{transform:scale(1.15)}.cfb.on{border-color:var(--tx)}.fx{font-size:1.25em;margin:10px 0;overflow-x:auto}
</style></head><body>
<div id="main"></div><div id="pop"></div><button id="fab" data-a="ad" aria-label="Quick add">+</button>
<nav><button data-a="nv" data-v="today"><span>📅</span>Today</button><button data-a="nv" data-v="week"><span>🗓️</span>Week</button><button data-a="nv" data-v="month"><span>📆</span>Month</button><button data-a="nv" data-v="plan"><span>🧠</span>Plan</button><button data-a="nv" data-v="study"><span>📚</span>Study</button><button data-a="nv" data-v="set"><span>⚙️</span>Settings</button></nav>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<script>
const $=s=>document.querySelector(s);
const TY={'Formula Revision':['🧮','#6366f1'],'Theory':['📖','#0ea5e9'],'Practice Questions':['✏️','#10b981'],'Test Paper':['📝','#f59e0b']};
const SU={Physics:'#3b82f6',Chemistry:'#10b981',Mathematics:'#f43f5e'};
const CT={ocean:['#3b82f6','#06b6d4'],forest:['#10b981','#84cc16'],sunset:['#f97316','#ec4899'],grape:['#8b5cf6','#d946ef']};
const PRI=['Low','Medium','High'],SP=[0,1,3,7,14,30];
let S;try{S=JSON.parse(localStorage.sm1)}catch(e){}S=S||{tasks:[],set:{mode:'auto',c:'ocean',morning:'07:00',evening:'21:00'},fired:{}};
let V='today',WD,MD;
const save=()=>{try{localStorage.sm1=JSON.stringify(S)}catch(e){}};
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,pd=s=>new Date(s+'T00:00'),today=()=>iso(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())},mins=n=>+n.slice(0,2)*60+ +n.slice(3);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),T=id=>S.tasks.find(t=>t.id==id);
WD=MD=today();
function occ(t,d){const k=diff(t.date,d);if(k<0||(t.skip&&t.skip[d]))return false;return(t.rep=='none'&&k==0)||t.rep=='daily'||(t.rep=='weekly'&&k%7==0)||(t.rep=='spaced'&&SP.includes(k))}
const on=d=>S.tasks.filter(t=>occ(t,d)).map(t=>({t,d,tm:(t.snz&&t.snz[d])||t.time,dn:!!(t.dn&&t.dn[d])})).sort((a,b)=>a.tm<b.tm?-1:1);
const empty=(e,a,b)=>`<div class="em"><div>${e}</div><b>${a}</b><br><small>${b}</small></div>`;
function card(o){const{t,d,tm,dn}=o,od=!dn&&(d<today()||(d==today()&&tm<nowHM())),ty=TY[t.type];
const sb=(m,l)=>`<button data-a="sn" data-i="${t.id}" data-d="${d}" data-m="${m}">${l}</button>`;
return`<div class="cd tk ${dn?'dn':''} ${od?'od':''}" style="--tc:${SU[t.sub]||'#888'}"><div class="r"><button class="ck" data-a="tg" data-i="${t.id}" data-d="${d}" aria-label="Done">${dn?'✓':''}</button><div class="g"><b>${esc(t.sub)} · ${esc(t.ch)||'—'}</b><small><i class="bg" style="background:${ty[1]}">${ty[0]} ${t.type}</i>${d<today()?d+' · ':''}${tm} · ${t.dur}m · ${PRI[t.pri]}${t.rep!='none'?' · 🔁 '+t.rep:''}${od?' · ⚠ overdue':''}</small></div><button class="ic" data-a="ed" data-i="${t.id}" aria-label="Edit">⋯</button></div>${t.notes?`<div class="nt">${esc(t.notes)}</div>`:''}${dn?'':`<div class="r sz">${sb(10,'+10 min')}${sb(60,'+1 hr')}${sb('t','Tomorrow')}</div>`}</div>`}
function vToday(){const d=today(),L=on(d),od=[];for(let k=14;k>0;k--)on(addD(d,-k)).forEach(o=>{if(!o.dn&&o.t.rep=='none')od.push(o)});
const n=L.filter(o=>o.dn).length;let h=`<h2>Today<small>${new Date().toDateString()}</small></h2><div class="cd pg"><div style="width:${L.length?n/L.length*100:0}%"></div></div><small>${n}/${L.length} done</small>`;
if(od.length)h+=`<h3 class="rd">⚠ Overdue</h3>`+od.map(card).join('');
Object.keys(TY).forEach(ty=>{const g=L.filter(o=>o.t.type==ty);if(g.length)h+=`<h3 style="color:${TY[ty][1]}">${TY[ty][0]} ${ty}</h3>`+g.map(card).join('')});
return h+(L.length||od.length?'':empty('🌱','Nothing planned today','Tap + to add your first study task.'))}
const mon=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const chip=o=>`<div class="chip ${o.dn?'dn':''}" draggable="true" data-a="ed" data-i="${o.t.id}" data-drag="${o.t.id}|${o.d}" style="--tc:${SU[o.t.sub]||'#888'};--ty:${TY[o.t.type][1]}">${TY[o.t.type][0]} ${o.tm} ${esc(o.t.sub.slice(0,4))}${o.t.ch?' · '+esc(o.t.ch):''}</div>`;
function vWeek(){const s=mon(WD);let h=`<div class="r"><button class="ic" data-a="wk" data-n="-7">‹</button><h2 class="g">Week of ${pd(s).toLocaleDateString('en',{day:'numeric',month:'short'})}<small>Drag a task onto another day to reschedule</small></h2><button class="ic" data-a="wk" data-n="7">›</button></div>`;
for(let i=0;i<7;i++){const d=addD(s,i),L=on(d);h+=`<div class="cd dy ${d==today()?'now':''}" data-drop="${d}"><b>${pd(d).toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})}</b><br>${L.map(chip).join('')||'<small>Free day 🎈</small>'}</div>`}return h}
function vMonth(){const f=pd(MD.slice(0,8)+'01'),s=mon(iso(f));let h=`<div class="r"><button class="ic" data-a="mo" data-n="-1">‹</button><h2 class="g">${f.toLocaleDateString('en',{month:'long',year:'numeric'})}<small>Tap a day to open its week</small></h2><button class="ic" data-a="mo" data-n="1">›</button></div><div class="mg">`+'MTWTFSS'.split('').map(x=>`<small>${x}</small>`).join('');
for(let i=0;i<42;i++){const d=addD(s,i),L=on(d);h+=`<div class="cd mc ${d==today()?'now':''} ${d.slice(0,7)!=MD.slice(0,7)?'ot':''}" data-drop="${d}" data-a="gw" data-d="${d}"><b>${+d.slice(8)}</b><div>${L.slice(0,4).map(o=>`<i class="dt" draggable="true" data-drag="${o.t.id}|${o.d}" style="background:${SU[o.t.sub]||'#888'}"></i>`).join('')}${L.length>4?'<small>+</small>':''}</div></div>`}return h+'</div>'}
function vSet(){const s=S.set,np='Notification'in window?Notification.permission:'n/a';
return`<h2>Settings</h2><div class="cd p"><b>Colour theme</b><div class="r" style="margin-top:8px">${Object.entries(CT).map(([k,v])=>`<button class="sw ${s.c==k?'on':''}" data-a="th" data-v="${k}" title="${k}" style="background:linear-gradient(135deg,${v[0]},${v[1]})"></button>`).join('')}</div><label>Mode<select data-s="mode">${['auto','light','dark'].map(m=>`<option ${m==s.mode?'selected':''}>${m}</option>`).join('')}</select></label></div>
<div class="cd p"><b>Reminders</b><div class="r"><label class="g">☀️ Morning plan<input type="time" data-s="morning" value="${s.morning}"></label><label class="g">🌙 Evening check-in<input type="time" data-s="evening" value="${s.evening}"></label></div><small>Notifications: ${np}. Keep this tab/app open for reminders.</small><br><button class="btn pr" data-a="nt">Enable notifications</button><button class="btn" data-a="ts">Test sound</button></div>
<div class="cd p"><b>Data</b><br><button class="btn rd" data-a="cs">Clear sample data</button></div>`}
function render(){$('#main').innerHTML={today:vToday,week:vWeek,month:vMonth,plan:vPlan,study:vStudy,set:vSet}[V]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V));
if(window.renderMathInElement)try{renderMathInElement($('#main'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],output:'mathml',throwOnError:false})}catch(e){}}
const go=()=>{save();render()};
function apply(){const r=document.documentElement,c=CT[S.set.c]||CT.ocean;r.dataset.mode=S.set.mode;r.style.setProperty('--ac',c[0]);r.style.setProperty('--ac2',c[1])}
function form(id){const t=id?T(id):{type:'Practice Questions',sub:'Physics',ch:'',date:today(),time:'18:00',dur:45,pri:1,rep:'none',notes:''};
const sel=(n,a,v)=>`<select id="${n}">${a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
$('#sh').innerHTML=`<h3>${id?'Edit':'New'} task</h3><label>Type${sel('fty',Object.keys(TY),t.type)}</label><label>Subject${sel('fsu',Object.keys(SU),t.sub)}</label><label>Chapter<input id="fch" value="${esc(t.ch)}" placeholder="e.g. Integrals"></label><div class="r"><label class="g">Date<input id="fd" type="date" value="${t.date}"></label><label class="g">Time<input id="ft" type="time" value="${t.time}"></label></div><div class="r"><label class="g">Duration (min)<input id="fdu" type="number" min="5" step="5" value="${t.dur}"></label><label class="g">Priority<select id="fp">${PRI.map((p,i)=>`<option value="${i}" ${i==t.pri?'selected':''}>${p}</option>`).join('')}</select></label></div><label>Repeat<select id="fr">${[['none','None'],['daily','Daily'],['weekly','Weekly'],['spaced','Spaced revision (1, 3, 7, 14, 30 days)']].map(([v,l])=>`<option value="${v}" ${v==t.rep?'selected':''}>${l}</option>`).join('')}</select></label><label>Notes (formulas: $x^2$ or $\\frac{a}{b}$)<textarea id="fn" rows="3">${esc(t.notes)}</textarea></label><div class="r"><button class="btn pr g" data-a="sv" data-i="${id||''}">Save</button>${id?`<button class="btn rd" data-a="del" data-i="${id}">Delete</button>`:''}<button class="btn" data-a="cl">Cancel</button></div>`;$('#ov').classList.add('on')}
function snooze(id,d,m){const t=T(id);if(m=='t'){if(t.rep=='none')t.date=addD(d,1);else{S.tasks.push({...JSON.parse(JSON.stringify(t)),id:uid(),date:addD(d,1),rep:'none',skip:{},dn:{},snz:{}});t.skip[d]=1}return}
const n=new Date();n.setMinutes(n.getMinutes()+ +m);const hm=pad(n.getHours())+':'+pad(n.getMinutes());if(t.rep=='none'){t.date=iso(n);t.time=hm}else t.snz[d]=hm}
function move(id,from,to){const t=T(id);if(!t||from==to)return;if(t.rep=='none')t.date=to;else{S.tasks.push({...JSON.parse(JSON.stringify(t)),id:uid(),date:to,rep:'none',skip:{},dn:{},snz:{}});t.skip[from]=1}go()}
const A={nv:d=>{V=d.v;render()},tg:d=>{const t=T(d.i);t.dn=t.dn||{};t.dn[d.d]=!t.dn[d.d];go()},sn:d=>{snooze(d.i,d.d,d.m);go()},ed:d=>form(d.i),ad:()=>form(),cl:()=>$('#ov').classList.remove('on'),
sv:d=>{const g=i=>$('#'+i).value,o={type:g('fty'),sub:g('fsu'),ch:g('fch').trim(),date:g('fd'),time:g('ft'),dur:+g('fdu')||30,pri:+g('fp'),rep:g('fr'),notes:g('fn')};if(!o.date||!o.time)return toast('Missing info','Pick a date and time');
if(d.i)Object.assign(T(d.i),o,{snz:{}});else S.tasks.push({...o,id:uid(),dn:{},skip:{},snz:{}});A.cl();go()},
del:d=>{S.tasks=S.tasks.filter(t=>t.id!=d.i);A.cl();go()},wk:d=>{WD=addD(WD,+d.n);render()},mo:d=>{const f=pd(MD.slice(0,8)+'01');MD=iso(new Date(f.getFullYear(),f.getMonth()+ +d.n,1));render()},gw:d=>{WD=d.d;V='week';render()},
th:d=>{S.set.c=d.v;apply();go()},nt:()=>{'Notification'in window?Notification.requestPermission().then(()=>{toast('Notifications',Notification.permission);render()}):toast('Not supported','This browser has no notifications')},
cs:()=>{if(confirm('Remove all sample tasks?')){S.tasks=S.tasks.filter(t=>!t.sample);go()}},ts:()=>alertU('🔔 Test','Sound + popup working!')};
document.addEventListener('click',e=>{if(e.target.id=='ov')return A.cl();const x=e.target.closest('[data-a]');if(x&&A[x.dataset.a])A[x.dataset.a](x.dataset)});
document.addEventListener('change',e=>{const k=e.target.dataset.s;if(k){S.set[k]=e.target.value;apply();save()}});
document.addEventListener('dragstart',e=>{const x=e.target.closest&&e.target.closest('[data-drag]');if(x)e.dataTransfer.setData('text',x.dataset.drag)});
document.addEventListener('dragover',e=>{const x=e.target.closest('[data-drop]');if(x){e.preventDefault();x.classList.add('hv')}});
document.addEventListener('dragleave',e=>{const x=e.target.closest('[data-drop]');if(x)x.classList.remove('hv')});
document.addEventListener('drop',e=>{const x=e.target.closest('[data-drop]');if(!x)return;e.preventDefault();const[id,f]=e.dataTransfer.getData('text').split('|');move(id,f,x.dataset.drop)});
const KB={Physics:[
'Electric Charges and Fields|3|Derivation~5m~Field of dipole, Gauss-law applications (wire/plane/sphere);Numerical~2-3m~Coulomb force, superposition, flux;Concept~1m~Field lines, Gauss law|Coulomb law;Electric field & field lines;Dipole;Gauss law & applications',
'Electrostatic Potential and Capacitance|3|Numerical~3m~Capacitor combinations, energy stored;Derivation~5m~Dipole potential, parallel-plate capacitor with dielectric;Case-based~4m~Capacitors, equipotential surfaces|Potential & potential energy;Dipole potential;Capacitors & dielectrics;Energy stored',
